<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>geometry3d GSAP SVG backend</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #050914; color: #d9f7ff; }
      main { width: min(94vw, 1040px); display: grid; gap: 1rem; }
      header, .transport { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 1rem; font-weight: 500; color: #bcefff; letter-spacing: 0.08em; }
      .badge { color: #69d9a6; font-size: 0.7rem; letter-spacing: 0.12em; }
      .stage { border: 1px solid #19364a; background: #070c16; box-shadow: 0 24px 80px #000a; overflow: hidden; }
      svg { display: block; width: 100%; height: auto; }
      .transport { padding: 0.8rem; border: 1px solid #19364a; background: #091522; }
      .group { display: flex; align-items: center; gap: 0.55rem; }
      button, select { border: 1px solid #28516a; border-radius: 0; padding: 0.45rem 0.65rem; color: #d9f7ff; background: #0b1b2b; font: inherit; font-size: 0.75rem; letter-spacing: 0.06em; }
      button { cursor: pointer; }
      button:hover { border-color: #70d9ff; }
      label { display: flex; align-items: center; gap: 0.45rem; color: #7aa5b8; font-size: 0.72rem; letter-spacing: 0.07em; }
      #progress { flex: 1; min-width: 180px; accent-color: #70d9ff; }
      #time-readout { min-width: 7.8rem; text-align: right; color: #8fdcf4; font-size: 0.72rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>GEOMETRY3D / GSAP SVG</h1>
        <span class="badge">VECTOR PAINTER BACKEND</span>
      </header>
      <div class="stage">
        <svg id="geometry3d-svg" xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"></svg>
      </div>
      <section class="transport" aria-label="Animation controls">
        <div class="group">
          <button id="play-toggle" type="button">PAUSE</button>
          <button id="reverse" type="button">REVERSE</button>
          <button id="restart" type="button">RESTART</button>
        </div>
        <input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="Timeline progress">
        <span id="time-readout">0.00 / 8.00s</span>
        <div class="group">
          <label>DEMO
            <select id="demo-select">
              <option value="torus">Torus</option>
              <option value="dolly">Dolly zoom</option>
            </select>
          </label>
          <label>SPEED
            <select id="speed">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
            </select>
          </label>
          <label><input id="loop" type="checkbox" checked> LOOP</label>
        </div>
      </section>
    </main>
    <script type="module">
      import { gsap } from "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm";
      globalThis.gsap = gsap;
      await import("./demo.js");
    </script>
  </body>
</html>
